<script>
/* ==========================================
   WINAMP XP V1
   ========================================== */

const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");
const playlistEl = document.getElementById("playlist");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

let tracks = [];
let currentIndex = -1;
let selectedIndex = -1;

let shuffle = false;
let repeat = false;

let playlistTitle = "Default Playlist";

let db;

/* ==========================================
   INDEXED DB
   ========================================== */

const DB_NAME = "WinampXP_DB";
const DB_VERSION = 1;

function initDB(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = e => {

            const database = e.target.result;

            if(!database.objectStoreNames.contains("tracks")){
                database.createObjectStore(
                    "tracks",
                    {keyPath:"id",autoIncrement:true}
                );
            }

        };

        request.onsuccess = e => {
            db = e.target.result;
            resolve();
        };

        request.onerror = () => reject(request.error);

    });

}

function saveTrack(track){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction("tracks","readwrite");

        const store =
            tx.objectStore("tracks");

        const request =
            store.add(track);

        request.onsuccess = () => {

            track.id = request.result;

            resolve(track);
        };

        request.onerror = () => reject(request.error);

    });

}

function getTracks(){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction("tracks","readonly");

        const store =
            tx.objectStore("tracks");

        const request =
            store.getAll();

        request.onsuccess = () =>
            resolve(request.result);

        request.onerror = () =>
            reject(request.error);

    });

}

function deleteTrackFromDB(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction("tracks","readwrite");

        tx.objectStore("tracks").delete(id);

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);

    });

}

function clearDB(){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction("tracks","readwrite");

        tx.objectStore("tracks").clear();

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);

    });

}

/* ==========================================
   LOAD
   ========================================== */

async function loadLibrary(){

    try{

        await initDB();

        const saved = await getTracks();

        tracks = saved.map(t => {

            return {
                ...t,
                url:URL.createObjectURL(t.blob)
            };

        });

        renderPlaylist();

    }catch(error){

        console.error(error);

        alert(
            "Your browser could not open the local media library."
        );

    }

}

/* ==========================================
   FILE IMPORT
   ========================================== */

function openFiles(){
    fileInput.click();
}

fileInput.addEventListener("change",async e=>{

    await addFiles([...e.target.files]);

    fileInput.value="";

});

async function addFiles(files){

    if(!files.length)return;

    for(const file of files){

        if(!file.type.startsWith("audio/") &&
           !file.type.startsWith("video/")){
            continue;
        }

        try{

            const track = await saveTrack({

                name:file.name,

                type:file.type,

                size:file.size,

                blob:file,

                favorite:false,

                added:Date.now()

            });

            track.url =
                URL.createObjectURL(file);

            tracks.push(track);

        }catch(error){

            console.error(error);

            alert(
                "Could not save " +
                file.name +
                ". Your browser may be out of storage space."
            );

        }

    }

    renderPlaylist();

    if(currentIndex === -1 && tracks.length){
        loadTrack(0);
    }

}

/* ==========================================
   DRAG & DROP
   ========================================== */

function handleDrop(event){

    event.preventDefault();

    const files =
        [...event.dataTransfer.files];

    addFiles(files);

}

/* ==========================================
   PLAYLIST
   ========================================== */

function renderPlaylist(){

    playlistEl.innerHTML="";

    if(!tracks.length){

        playlistEl.innerHTML =
            `<div class="empty">
                Drop music files here<br>
                or click Add
            </div>`;

    }else{

        tracks.forEach((track,index)=>{

            const row =
                document.createElement("div");

            row.className =
                "song" +
                (index===currentIndex ? " active":"");

            row.innerHTML = `
                <div class="song-number">
                    ${String(index+1).padStart(2,"0")}
                </div>

                <div class="song-name">
                    ${escapeHTML(track.name)}
                </div>

                <div class="song-duration">
                    ${track.duration || "--:--"}
                </div>
            `;

            row.onclick = () => {

                selectedIndex=index;

                loadTrack(index);

            };

            row.ondblclick = () =>
                loadTrack(index);

            playlistEl.appendChild(row);

        });

    }

    document.getElementById("songCount").textContent =
        tracks.length +
        (tracks.length===1 ? " track":" tracks");

    document.getElementById("playlistName").textContent =
        playlistTitle;

}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* ==========================================
   LOAD TRACK
   ========================================== */

function loadTrack(index){

    if(index < 0 || index >= tracks.length)return;

    currentIndex=index;
    selectedIndex=index;

    const track=tracks[index];

    audio.src=track.url;

    document.getElementById("trackName")
        .textContent=track.name;

    document.getElementById("status")
        .textContent="READY";

    progress.value=0;

    renderPlaylist();

}

/* ==========================================
   PLAY
   ========================================== */

function playPause(){

    if(!tracks.length){

        openFiles();

        return;
    }

    if(currentIndex===-1){

        loadTrack(0);

    }

    if(audio.paused){

        audio.play()
            .then(()=>{

                document.getElementById("status")
                    .textContent="PLAYING";

            })
            .catch(()=>{

                document.getElementById("status")
                    .textContent="READY";

            });

    }else{

        audio.pause();

        document.getElementById("status")
            .textContent="PAUSED";

    }

}

function stopTrack(){

    audio.pause();

    audio.currentTime=0;

    document.getElementById("status")
        .textContent="STOPPED";

}

function previousTrack(){

    if(!tracks.length)return;

    let next=currentIndex-1;

    if(next<0)next=tracks.length-1;

    loadTrack(next);

    audio.play().catch(()=>{});

}

function nextTrack(){

    if(!tracks.length)return;

    let next;

    if(shuffle){

        next =
            Math.floor(
                Math.random()*tracks.length
            );

    }else{

        next=currentIndex+1;

        if(next>=tracks.length){

            if(repeat){
                next=0;
            }else{

                stopTrack();

                return;

            }

        }

    }

    loadTrack(next);

    audio.play().catch(()=>{});

}

/* ==========================================
   AUDIO EVENTS
   ========================================== */

audio.addEventListener("timeupdate",()=>{

    if(!audio.duration)return;

    progress.value =
        (audio.currentTime/audio.duration)*100;

    document.getElementById("time")
        .textContent =
        formatTime(audio.currentTime);

});

audio.addEventListener("loadedmetadata",()=>{

    if(currentIndex<0)return;

    tracks[currentIndex].duration =
        formatTime(audio.duration);

    renderPlaylist();

});

audio.addEventListener("ended",()=>{

    if(repeat){

        audio.currentTime=0;

        audio.play().catch(()=>{});

    }else{

        nextTrack();

    }

});

progress.addEventListener("input",()=>{

    if(!audio.duration)return;

    audio.currentTime =
        (progress.value/100)*audio.duration;

});

volume.addEventListener("input",()=>{

    audio.volume=Number(volume.value);

    localStorage.setItem(
        "winamp-volume",
        volume.value
    );

});

/* ==========================================
   MODES
   ========================================== */

function toggleShuffle(){

    shuffle=!shuffle;

    document
        .getElementById("shuffleButton")
        .classList.toggle("active",shuffle);

}

function toggleRepeat(){

    repeat=!repeat;

    document
        .getElementById("repeatButton")
        .classList.toggle("active",repeat);

}

/* ==========================================
   REMOVE
   ========================================== */

async function removeSelected(){

    if(selectedIndex<0 ||
       selectedIndex>=tracks.length){

        return;

    }

    const track =
        tracks[selectedIndex];

    if(currentIndex===selectedIndex){

        audio.pause();
        audio.removeAttribute("src");
        audio.load();

        currentIndex=-1;

    }else if(currentIndex>selectedIndex){

        currentIndex--;

    }

    URL.revokeObjectURL(track.url);

    await deleteTrackFromDB(track.id);

    tracks.splice(selectedIndex,1);

    selectedIndex=-1;

    renderPlaylist();

}

async function clearPlaylist(){

    if(!tracks.length)return;

    if(!confirm(
        "Remove all tracks from this library?"
    ))return;

    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    tracks.forEach(t=>{
        if(t.url)URL.revokeObjectURL(t.url);
    });

    await clearDB();

    tracks=[];

    currentIndex=-1;
    selectedIndex=-1;

    renderPlaylist();

}

/* ==========================================
   PLAYLIST NAME
   ========================================== */

function newPlaylist(){

    showModal(
        "New Playlist",
        "Enter a name for the playlist:",
        value=>{

            if(value.trim()){

                playlistTitle=value.trim();

                renderPlaylist();

            }

        }
    );

}

function renamePlaylist(){

    showModal(
        "Rename Playlist",
        "Enter a new playlist name:",
        value=>{

            if(value.trim()){

                playlistTitle=value.trim();

                renderPlaylist();

            }

        }
    );

}

/* ==========================================
   MODAL
   ========================================== */

let modalCallback=null;

function showModal(title,text,callback){

    modalCallback=callback;

    document.querySelector("#modal .title")
        .textContent=title;

    document.getElementById("modalBody")
        .innerHTML=`
            <div>${text}</div>
            <input id="modalInput"
                   autocomplete="off">
        `;

    document.getElementById("modal")
        .style.display="flex";

    setTimeout(()=>{

        document
            .getElementById("modalInput")
            .focus();

    },50);

}

function confirmModal(){

    const value =
        document.getElementById("modalInput").value;

    closeModal();

    if(modalCallback){

        const callback=modalCallback;

        modalCallback=null;

        callback(value);

    }

}

function closeModal(){

    document.getElementById("modal")
        .style.display="none";

    modalCallback=null;

}

/* ==========================================
   VISUALIZER
   ========================================== */

const visualizer =
    document.getElementById("visualizer");

for(let i=0;i<28;i++){

    const bar=document.createElement("div");

    bar.className="bar";

    visualizer.appendChild(bar);

}

const bars =
    [...document.querySelectorAll(".bar")];

setInterval(()=>{

    const playing =
        !audio.paused &&
        !audio.ended;

    bars.forEach(bar=>{

        if(playing){

            bar.style.height =
                (8+Math.random()*48)+"px";

        }else{

            bar.style.height =
                "5px";

        }

    });

/* ==========================================
   KEYBOARD
   ========================================== */

document.addEventListener("keydown",e=>{

    if(
        e.target.tagName==="INPUT" &&
        e.target.id!=="progress"
    ){
        return;
    }

    switch(e.code){

        case "Space":
            e.preventDefault();
            playPause();
            break;

        case "ArrowRight":
            nextTrack();
            break;

        case "ArrowLeft":
            previousTrack();
            break;

        case "Escape":
            stopTrack();
            break;

    }

});

/* ==========================================

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "00:00";
    }

    seconds=Math.floor(seconds);

    const minutes =
        Math.floor(seconds/60);

    const secs =
        seconds%60;

    return String(minutes).padStart(2,"0")
        +":"
        +String(secs).padStart(2,"0");

}
