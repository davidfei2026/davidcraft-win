<body>

<div class="app">

<!-- =====================================================

            </button>

<script>

/* =====================================================
   LANGUAGE DATA
===================================================== */

const LANGUAGES = {

    python:{
        name:"Python 3",
        extension:"py",
        file:"new.py",
        icon:"🐍",
        prompt:">>>",
        image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Python-logo-notext.svg"
    },

    javascript:{
        name:"JavaScript",
        extension:"js",
        file:"script.js",
        icon:"🟨",
        prompt:">",
        image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/JavaScript_logo.svg"
    },

    html:{
        name:"HTML5",
        extension:"html",
        file:"index.html",
        icon:"🌐",
        prompt:"html>",
        image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/HTML5_logo.svg"
    },

    css:{
        name:"CSS3",
        extension:"css",
        file:"style.css",
        icon:"🎨",
        prompt:"css>",
        image:"https://commons.wikimedia.org/wiki/Special:Redirect/file/CSS3_logo.svg"
    }

};


/* =====================================================
   STARTER FILES
===================================================== */

const STARTERS = {

python:
`# Python 3

name = "David"

print("Hello, " + name)

x = 10
y = 5

print(x + y)
`,

javascript:
`// JavaScript

let name = "David";

console.log("Hello, " + name);

let x = 10;
let y = 5;

console.log(x + y);
`,

html:
`<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Website</title>
</head>

<body>

    <h1>Hello World!</h1>

    <p>Welcome to my website.</p>

    <button onclick="hello()">
        Click Me
    </button>

</body>
</html>
`,

css:
`body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    padding: 40px;
}

h1 {
    font-size: 42px;
}

p {
    font-size: 20px;
}
`

};


/* =====================================================
   STATE
===================================================== */

let files = [];

let activeFileId = null;

let language = "python";

let terminalHistory = [];

let terminalHistoryIndex = -1;

let pythonVariables = {};

let javascriptVariables = {};

let lastRunCode = "";


/* =====================================================
   DOM
===================================================== */

const editor =
    document.getElementById("editor");

const gutter =
    document.getElementById("gutter");

const tabs =
    document.getElementById("tabs");

const fileList =
    document.getElementById("fileList");

const outputPanel =
    document.getElementById("outputPanel");

const terminalPanel =
    document.getElementById("terminalPanel");

const problemsPanel =
    document.getElementById("problemsPanel");

const termInput =
    document.getElementById("termInput");

const termPrompt =
    document.getElementById("termPrompt");

const preview =
    document.getElementById("preview");

const previewFrame =
    document.getElementById("previewFrame");

const statusText =
    document.getElementById("statusText");

const statusRight =
    document.getElementById("statusRight");

const modalBg =
    document.getElementById("modalBg");

const fileInput =
    document.getElementById("fileInput");


/* =====================================================
   FILE CREATION
===================================================== */

function createFile(lang, customName=null, content=null){

    const info =
        LANGUAGES[lang];

    const file = {

        id:
            Date.now() +
            Math.random(),

        name:
            customName ||
            info.file,

        language:lang,

        content:
            content !== null
            ? content
            : STARTERS[lang],

        saved:true

    };

    files.push(file);

    renderFiles();

    openFile(file.id);
}


/* =====================================================
   OPEN FILE
===================================================== */

function openFile(id){

    const file =
        files.find(
            f=>f.id === id
        );

    if(!file)
        return;

    activeFileId =
        id;

    language =
        file.language;

    editor.value =
        file.content;

    renderFiles();

    renderTabs();

    updateEditor();

    statusText.textContent =
        "Opened " + file.name;

    statusRight.textContent =
        LANGUAGES[language].name;

    editor.focus();
}


/* =====================================================
   SAVE CURRENT EDITOR
===================================================== */

function updateCurrentFile(){

    const file =
        files.find(
            f=>f.id === activeFileId
        );

    if(!file)
        return;

    file.content =
        editor.value;

    file.saved =
        false;

    renderFiles();
    renderTabs();
}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(){

    fileList.innerHTML = "";

    files.forEach(file=>{

        const button =
            document.createElement("button");

        button.className =
            "file-item" +
            (
                file.id === activeFileId
                ? " active"
                : ""
            );

        const icon =
            document.createElement("img");

        icon.className =
            "file-icon";

        icon.src =
            LANGUAGES[
                file.language
            ].image;

        icon.alt =
            LANGUAGES[
                file.language
            ].name;

        const name =
            document.createElement("span");

        name.className =
            "file-name";

        name.textContent =
            file.name +
            (
                file.saved
                ? ""
                : " •"
            );

        button.appendChild(icon);
        button.appendChild(name);

        button.addEventListener(
            "click",
            ()=>{
                openFile(file.id);
            }
        );

        fileList.appendChild(button);

    });
}


/* =====================================================
   RENDER TABS
===================================================== */

function renderTabs(){

    tabs.innerHTML = "";

    files.forEach(file=>{

        const tab =
            document.createElement("div");

        tab.className =
            "tab" +
            (
                file.id === activeFileId
                ? " active"
                : ""
            );

        const icon =
            document.createElement("span");

        icon.className =
            "tab-icon";

        icon.textContent =
            LANGUAGES[
                file.language
            ].icon;

        const name =
            document.createElement("span");

        name.className =
            "tab-name";

        name.textContent =
            file.name;

        const unsaved =
            document.createElement("span");

        unsaved.className =
            "tab-unsaved";

        unsaved.textContent =
            file.saved
            ? ""
            : "●";

        const close =
            document.createElement("span");

        close.className =
            "tab-close";

        close.textContent =
            "×";

        tab.appendChild(icon);
        tab.appendChild(name);
        tab.appendChild(unsaved);
        tab.appendChild(close);

        tab.addEventListener(
            "click",
            event=>{

                if(
                    event.target === close
                ){

                    closeFile(file.id);

                }else{

                    openFile(file.id);

                }

            }
        );

        tabs.appendChild(tab);

    });
}


/* =====================================================
   CLOSE FILE
===================================================== */

function closeFile(id){

    const index =
        files.findIndex(
            f=>f.id === id
        );

    if(index === -1)
        return;

    files.splice(index,1);

    if(files.length === 0){

        createFile("python");

        return;
    }

    if(activeFileId === id){

        const next =
            files[
                Math.max(
                    0,
                    index - 1
                )
            ];

        openFile(next.id);

    }else{

        renderFiles();
        renderTabs();
    }
}

/* =====================================================
   EDITOR KEYBOARD
===================================================== */

editor.addEventListener(
    "keydown",
    event=>{

        /* TAB */

        if(event.key === "Tab"){

            event.preventDefault();

            const start =
                editor.selectionStart;

            const end =
                editor.selectionEnd;

            editor.value =
                editor.value.slice(0,start) +
                "    " +
                editor.value.slice(end);

            editor.selectionStart =
                editor.selectionEnd =
                    start + 4;

            updateCurrentFile();
            updateEditor();

            return;
        }


        /* RUN */

        if(
            event.key === "Enter" &&
            (event.metaKey || event.ctrlKey)
        ){

            event.preventDefault();

            runCode();

            return;
        }


        /* AUTO CLOSING */

        const pairs = {
            "(":")",
            "[":"]",
            "{":"}",
            '"':'"',
            "'":"'"
        };

        if(pairs[event.key]){

            const start =
                editor.selectionStart;

            const end =
                editor.selectionEnd;

            if(start !== end)
                return;

            event.preventDefault();

            const close =
                pairs[event.key];

            editor.value =
                editor.value.slice(0,start) +
                event.key +
                close +
                editor.value.slice(end);

            editor.selectionStart =
                editor.selectionEnd =
                    start + 1;

            updateCurrentFile();
            updateEditor();
        }

    }
);

/* =====================================================
   PYTHON
===================================================== */

function pythonMath(expression){

    if(
        !/^[0-9+\-*/%().\s]+$/.test(
            expression
        )
    )
        return undefined;

    try{

        const result =
            Function(
                '"use strict";return (' +
                expression +
                ')'
            )();

        if(
            typeof result !== "number" ||
            !Number.isFinite(result)
        )
            return undefined;

        return result;

    }catch{

        return undefined;
    }
}


function runPython(code){

    clearOutput();

    pythonVariables = {};

    const lines =
        code.split("\n");

    let printed = false;

    for(
        let raw of lines
    ){

        const line =
            raw.trim();

        if(
            !line ||
            line.startsWith("#")
        )
            continue;


        /* VARIABLE */

        const assignment =
            line.match(
                /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
            );

        if(assignment){

            const name =
                assignment[1];

            const value =
                assignment[2].trim();

            if(
                /^["'].*["']$/.test(value)
            ){

                pythonVariables[name] =
                    value.slice(1,-1);

            }else if(
                /^-?\d+(\.\d+)?$/.test(value)
            ){

                pythonVariables[name] =
                    Number(value);

            }else{

                const math =
                    pythonMath(
                        value
                    );

                if(math !== undefined){

                    pythonVariables[name] =
                        math;

                }else{

                    addOutput(
                        "NameError: unsupported assignment value",
                        "error"
                    );
                }
            }

            continue;
        }


        /* PRINT */

        const printMatch =
            line.match(
                /^print\s*\((.*)\)$/
            );

        if(printMatch){

            const expression =
                printMatch[1].trim();

            const parts =
                expression
                .split(",")
                .map(
                    part=>part.trim()
                );

            const result = [];

            let valid = true;

            for(
                const part of parts
            ){

                if(
                    /^["'].*["']$/.test(
                        part
                    )
                ){

                    result.push(
                        part.slice(1,-1)
                    );

                }else if(
                    part in pythonVariables
                ){

                    result.push(
                        pythonVariables[part]
                    );

                }else{

                    const math =
                        pythonMath(part);

                    if(
                        math !== undefined
                    ){

                        result.push(math);

                    }else{

                        valid = false;
                    }
                }
            }

            if(valid){

                addOutput(
                    result.join(" ")
                );

                printed = true;

            }else{

                addOutput(
                    "NameError: name is not defined",
                    "error"
                );
            }

            continue;
        }


        /* MATH */

        const math =
            pythonMath(line);

        if(math !== undefined){

            addOutput(
                String(math)
            );

            printed = true;

            continue;
        }


        /* LEN */

        const lenMatch =
            line.match(
                /^len\s*\((.*)\)$/
            );

        if(lenMatch){

            const value =
                lenMatch[1].trim();

            if(
                /^["'].*["']$/.test(value)
            ){

                addOutput(
                    String(
                        value.slice(1,-1).length
                    )
                );

            }else if(
                value in pythonVariables
            ){

                addOutput(
                    String(
                        String(
                            pythonVariables[value]
                        ).length
                    )
                );

            }else{

                addOutput(
                    "TypeError: object has no len()",
                    "error"
                );
            }

            printed = true;
            continue;
        }


        addOutput(
            `Python demo executed: ${line}`,
            "info"
        );
    }


    if(
        !printed &&
        outputPanel.children.length === 0
    ){

        addOutput(
            "Program finished with no output.",
            "info"
        );
    }
}


/* =====================================================
   JAVASCRIPT
===================================================== */

function runJavaScript(code){

    clearOutput();

    javascriptVariables = {};

    const lines =
        code.split("\n");

    for(
        let raw of lines
    ){

        let line =
            raw.trim();

        if(
            !line ||
            line.startsWith("//")
        )
            continue;


        const declaration =
            line.match(
                /^(let|const|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(.+);?$/
            );

        if(declaration){

            const name =
                declaration[2];

            let value =
                declaration[3]
                .replace(/;$/,"")
                .trim();

            if(
                /^["'].*["']$/.test(value)
            ){

                javascriptVariables[name] =
                    value.slice(1,-1);

            }else if(
                /^-?\d+(\.\d+)?$/.test(value)
            ){

                javascriptVariables[name] =
                    Number(value);

            }else{

                const math =
                    pythonMath(value);

                if(
                    math !== undefined
                ){

                    javascriptVariables[name] =
                        math;

                }
            }

            continue;
        }


        const consoleLog =
            line.match(
                /^console\.log\s*\((.*)\);?$/
            );

        if(consoleLog){

            const expression =
                consoleLog[1].trim();

            if(
                expression in
                javascriptVariables
            ){

                addOutput(
                    String(
                        javascriptVariables[
                            expression
                        ]
                    )
                );

            }else if(
                /^["'].*["']$/.test(
                    expression
                )){

                addOutput(
                    expression.slice(1,-1)
                );

            }else{

                const math =
                    pythonMath(
                        expression
                    );

                if(
                    math !== undefined
                ){

                    addOutput(
                        String(math)
                    );

                }else{

                    addOutput(
                        "undefined",
                        "error"
                    );
                }
            }

            continue;
        }


        addOutput(
            `JavaScript demo executed: ${line}`,
            "info"
        );
    }
}

function terminalPrint(

    type="normal"
){

    const row =
        document.createElement(
            "div"

        "terminal-line term-" +
        type;

function terminalCommand(command){

    const text =
        command.trim();

    if(!text)
        return;


    terminalPrint(
        termPrompt.textContent +
        " " +
        text
    );


    switch(text){

        case "help":
        case "help()":

            terminalPrint(
`Developer Studio Terminal V2

Commands:
  help
  clear
  history
  version
  about
  run
  preview
  new
  open
  save
  python
  javascript
  html
  css`,
                "info"
            );

            break;


        case "clear":

            terminalPanel.innerHTML = `
                <div class="terminal-line term-info">
                    Terminal cleared.
                </div>

                <div class="term-input-row">

                    <span
                        class="term-prompt"
                        id="termPrompt">
                        ${LANGUAGES[language].prompt}
                    </span>

                    <input
                        id="termInput"
                        class="term-input"
                        type="text"
                        autocomplete="off"
                        spellcheck="false">

                </div>
            `;

            reconnectTerminal();

            break;


        case "history":

            if(
                terminalHistory.length === 0
            ){

                terminalPrint(
                    "No command history.",
                    "warning"
                );

            }else{

                terminalHistory.forEach(
                    (item,index)=>{
                        terminalPrint(
                            `${index+1}  ${item}`
                        );
                    }
                );
            }

            break;


        case "version":

            terminalPrint(
                "Developer Studio V2",
                "info"
            );

            break;


        case "about":

            terminalPrint(
                "A browser-based code editor and multi-language terminal.",
                "info"
            );

            break;


        case "run":

            runCode();

            break;


        case "preview":

            preview.classList.add(
                "show"
            );

            break;


        case "new":

            modalBg.classList.add(
                "show"
            );

            break;


        case "open":

            fileInput.click();

            break;


        case "save":

            saveFile();

            break;


        case "python":
        case "python3":

            switchLanguage(
                "python"
            );

            terminalPrint(
                "Switched to Python 3.",
                "success"
            );

            break;


        case "javascript":
        case "js":

            switchLanguage(
                "javascript"
            );

            terminalPrint(
                "Switched to JavaScript.",
                "success"
            );

            break;


        case "html":
        case "html5":

            switchLanguage(
                "html"
            );

            terminalPrint(
                "Switched to HTML5.",
                "success"
            );

            break;


        case "css":
        case "css3":

            switchLanguage(
                "css"
            );

            terminalPrint(
                "Switched to CSS3.",
                "success"
            );

            break;


        default:

            terminalPrint(
                "Command not found: " +
                text,
                "error"
            );

    }
}


function terminalKeydown(event){

    const input =
        event.target;


    if(event.key === "Enter"){

        event.preventDefault();

        const command =
            input.value;

        if(command.trim()){

            terminalHistory.push(
                command
            );

            terminalHistoryIndex =
                terminalHistory.length;

            terminalCommand(
                command
            );

            input.value = "";
        }

        input.focus();

        return;
    }


    if(event.key === "ArrowUp"){

        event.preventDefault();

        if(
            terminalHistory.length === 0
        )
            return;

        terminalHistoryIndex =
            Math.max(
                0,
                terminalHistoryIndex - 1
            );

        input.value =
            terminalHistory[
                terminalHistoryIndex
            ];

        return;
    }


    if(event.key === "ArrowDown"){

        event.preventDefault();

        if(
            terminalHistory.length === 0
        )
            return;

        terminalHistoryIndex =
            Math.min(
                terminalHistory.length,
                terminalHistoryIndex + 1
            );

        input.value =
            terminalHistoryIndex ===
            terminalHistory.length
            ? ""
            : terminalHistory[
                terminalHistoryIndex
            ];
    }
}


function reconnectTerminal(){

    const input =
        document.getElementById(
            "termInput"
        );

    if(!input)
        return;

    input.addEventListener(
        "keydown",
        terminalKeydown
    );

    input.focus();
}

function saveFile(){

    const file =
        files.find(
            f=>f.id === activeFileId
        );

    if(!file)
        return;

    file.content =
        editor.value;

    file.saved =
        true;

    const blob =
        new Blob(
            [file.content],
            {
                type:"text/plain"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        file.name;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    renderFiles();
    renderTabs();

    statusText.textContent =
        "Saved " +
        file.name;
}
